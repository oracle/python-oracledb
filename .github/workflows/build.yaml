name: Build python-oracledb packages

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tgt:
        description: List of package targets to build
        default: 'Linux, macOS, Windows, Source'
        required: false
permissions:
  contents: read

jobs:

  build_source_package:
    name: Build source package
    if: contains(inputs.tgt, 'Source') || inputs.tgt == ''
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
                                  # v6.2.0
        with:
          cache: 'pip'
          python-version: 3.13

      - name: Ensure packages required to build are present
        run: python -m pip install cython setuptools

      - name: Build wheel for Python ${{ matrix.python-version }}
        run: python setup.py sdist

      - name: Upload the artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
                                     # v7.0.1
        with:
          name: python-oracledb-source
          path: dist

  build_linux_wheels:
    name: Build wheels for Linux
    if: contains(inputs.tgt, 'Linux') || inputs.tgt == ''
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        python-tag:
          - "cp310-cp310"
          - "cp311-cp311"
          - "cp312-cp312"
          - "cp313-cp313"
          - "cp314-cp314"
          - "cp315-cp315"
        libc:
          - "manylinux"
          - "musllinux"
        arch:
          - "amd64"
          - "arm64"
        include:
          - arch: "amd64"
            libc: "manylinux"
            runner: "ubuntu-24.04"
            container: "quay.io/pypa/manylinux_2_28_x86_64:latest"
          - arch: "amd64"
            libc: "musllinux"
            runner: "ubuntu-24.04"
            container: "quay.io/pypa/musllinux_1_2_x86_64:latest"
          - arch: "arm64"
            libc: "manylinux"
            runner: "ubuntu-24.04-arm"
            container: "quay.io/pypa/manylinux_2_28_aarch64:latest"
          - arch: "arm64"
            libc: "musllinux"
            runner: "ubuntu-24.04-arm"
            container: "quay.io/pypa/musllinux_1_2_aarch64:latest"

    steps:

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true

      - name: Build wheel
        run: |
          cat << EOF > build.sh
          set -e
          export PYO_COMPILE_ARGS=-g0
          manylinux-interpreters ensure ${{ matrix.python-tag }}
          /opt/python/${{ matrix.python-tag }}/bin/python -m build
          cd dist
          auditwheel repair *.whl
          rm *.whl
          mv wheelhouse/*.whl .
          EOF
          chmod +x build.sh
          docker run \
            -v $(pwd):/io  \
            -w /io \
            --platform linux/${{ matrix.arch }} \
            ${{ matrix.container }} \
            ./build.sh

      - name: Upload the artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
                                     # v7.0.1
        with:
          name: Linux_${{ matrix.libc }}_${{ matrix.arch}}_${{ matrix.python-tag }}_wheels
          path: dist/*.whl

  build_macos_wheels:
    name: Build wheels for macOS
    if: contains(inputs.tgt, 'macOS') || inputs.tgt == ''
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
        arch: ['']

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
                                  # v6.2.0
        with:
          cache: 'pip'
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.arch }}
          allow-prereleases: true

      - name: Ensure build package is present
        run: python -m pip install build

      - name: Build wheel for Python ${{ matrix.python-version }}
        run: python -m build

      - name: Upload the artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
                                     # v7.0.1
        with:
          name: python-oracledb-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.arch }}
          path: dist/*.whl

  build_windows_wheels:
    name: Build wheels for Windows
    if: contains(inputs.tgt, 'Windows') || inputs.tgt == ''
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
        arch: ['x86', 'x64']
        include:
          - os: windows-11-arm
            arch: arm64
            python-version: '3.11'
          - os: windows-11-arm
            arch: arm64
            python-version: '3.12'
          - os: windows-11-arm
            arch: arm64
            python-version: '3.13'
          - os: windows-11-arm
            arch: arm64
            python-version: '3.14'
          - os: windows-11-arm
            arch: arm64
            python-version: '3.15'

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
                                  # v6.2.0
        with:
          cache: 'pip'
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.arch }}
          allow-prereleases: true

      - name: Ensure build package is present
        run: python -m pip install build

      - name: Build wheel for Python ${{ matrix.python-version }}
        run: python -m build

      - name: Upload the artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
                                     # v7.0.1
        with:
          name: python-oracledb-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.arch }}
          path: dist/*.whl

  combine_artifacts:
    name: Combine artifacts
    if: ${{ always() }}
    needs: [build_source_package, build_linux_wheels, build_macos_wheels, build_windows_wheels]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/upload-artifact/merge@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
                                           # v7.0.1
        with:
          name: python-oracledb-wheels
          delete-merged: true
